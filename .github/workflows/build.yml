name: build-iso

# The build runs inside a Debian 13 container so we use Debian's own live-build
# (the version that knows how to build trixie). The host runner provides the
# loop devices live-build needs, hence --privileged.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean

      - name: Build the ISO in a Debian container
        run: |
          docker run --privileged --rm \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash -c '
              set -e
              apt-get update
              apt-get install -y live-build git gnupg curl ca-certificates \
                xz-utils squashfs-tools xorriso dosfstools mtools
              ./scripts/verify.sh
              ./scripts/fetch-tor-browser.sh 15.0.25
              ./build.sh
            '

      - name: Fix file ownership
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: adrishya-iso
          path: |
            adrishya-*.iso
            adrishya-*.iso.sha256
          if-no-files-found: error
          retention-days: 14
