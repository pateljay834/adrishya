#!/usr/sbin/nft -f
# Adrishya default-deny egress. The ONLY way out is the Tor process, which runs
# as the `debian-tor` user. Mirrors Tails' "no traffic without Tor" guarantee.
flush ruleset

table inet adrishya {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        oifname "lo" accept
        ct state established,related accept
        udp sport 68 accept
        meta skuid debian-tor accept
        log prefix "adrishya-drop " level warn
    }
}
