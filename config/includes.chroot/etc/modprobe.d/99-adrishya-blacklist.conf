# Adrishya: shrink the kernel attack surface and cut trace vectors.
blacklist firewire-core
blacklist firewire-ohci
blacklist thunderbolt
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf
# Bluetooth off by default; uncomment to allow.
blacklist bluetooth
# NOTE: usb-storage is NOT blacklisted - Adrishya boots from USB.
