<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="sky" cx="0.62" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#16304F"/>
      <stop offset="0.55" stop-color="#0E1E33"/>
      <stop offset="1" stop-color="#060C16"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B563"/>
      <stop offset="1" stop-color="#B87A2E"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#sky)"/>

  <!-- faint geometric field -->
  <g stroke="#2E4A6E" stroke-width="1" opacity="0.16">
    <line x1="0" y1="360" x2="2560" y2="360"/>
    <line x1="0" y1="720" x2="2560" y2="720"/>
    <line x1="0" y1="1080" x2="2560" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1440"/>
    <line x1="1280" y1="0" x2="1280" y2="1440"/>
    <line x1="1920" y1="0" x2="1920" y2="1440"/>
  </g>

  <!-- large faint emblem -->
  <g opacity="0.09">
    <circle cx="1560" cy="640" r="470" fill="none" stroke="url(#ring)"
            stroke-width="10" stroke-linecap="round"
            stroke-dasharray="2400 550" transform="rotate(-108 1560 640)"/>
    <text x="1560" y="880" text-anchor="middle"
          font-family="Annapurna SIL, Lohit Devanagari, Noto Sans Devanagari, Samyak Devanagari, sans-serif" font-size="640" fill="#F5F2EC">अ</text>
  </g>

  <!-- wordmark -->
  <text x="170" y="1230" font-family="Helvetica, Arial, sans-serif"
        font-size="74" font-weight="bold" letter-spacing="16" fill="#F5F2EC" opacity="0.92">ADRISHYA</text>
  <text x="174" y="1290" font-family="Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="6" fill="#E0A458" opacity="0.85">amnesic - tor by default - made in India</text>
</svg>